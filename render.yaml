services:
  # -------------------------------------------------------------
  # Backend API & Autonomous Swarm Engine
  # -------------------------------------------------------------
  - type: web
    name: forgeswarm-api
    env: python
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "python backend/start_server.py"
    envVars:
      - key: PORT
        value: 8002
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_LLM_PROVIDER
        value: mock
      # Optional: set GEMINI_API_KEY or OPENAI_API_KEY in Render dashboard

  # -------------------------------------------------------------
  # Frontend Cyberpunk Dashboard (SPA)
  # -------------------------------------------------------------
  - type: web
    name: forgeswarm-ui
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://forgeswarm-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
