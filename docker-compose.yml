version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://forgeswarm:swarmpass@db:5432/forgeswarm
      - HOST=0.0.0.0
      - PORT=8002
      - ENVIRONMENT=production
      - WORKSPACE_ROOT=/app/generated_projects
    volumes:
      - ./generated_projects:/app/generated_projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=forgeswarm
      - POSTGRES_PASSWORD=swarmpass
      - POSTGRES_DB=forgeswarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
